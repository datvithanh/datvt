<svg xmlns="http://www.w3.org/2000/svg" width="200" height="8" viewBox="0 0 200 8">
  <defs>
    <filter id="track" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="8" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="17" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComposite in="gray" in2="SourceAlpha" operator="in" result="grain"/>
      <feComposite in="SourceGraphic" in2="grain" operator="arithmetic" k1="0" k2="0.9" k3="0.1" k4="0"/>
    </filter>
  </defs>
  <path d="M0 4H200" fill="none" stroke="#0E0E0C" stroke-width="2.2" filter="url(#track)"/>
</svg>
