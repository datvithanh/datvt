<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 900" width="300" height="900" fill="none">
  <!-- Side column for the clay Bootcamp card (Dat, Nov 12): two bone track lanes, one rounded corner, bleeding off the
       right and bottom edges, after the "Middle of the day" track card. The grain is printed into the lanes. -->
  <defs>
    <filter id="wear" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.2  0 0 0 0 0.16  -0.9 0 0 0 0.5"/>
    </filter>
    <mask id="lanes">
      <path d="M300 60 H190 A130 130 0 0 0 60 190 V900" stroke="#fff" stroke-width="50"/>
      <path d="M300 122 H190 A68 68 0 0 0 122 190 V900" stroke="#fff" stroke-width="50"/>
    </mask>
  </defs>
  <g mask="url(#lanes)">
    <rect width="300" height="900" fill="#F2ECDC" fill-opacity="0.86"/>
    <rect width="300" height="900" filter="url(#wear)"/>
  </g>
</svg>
