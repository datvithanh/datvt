<svg xmlns="http://www.w3.org/2000/svg" viewBox="-700 -50 3200 1250" width="3200" height="1250" preserveAspectRatio="none">
  <!-- Hero glyph field shape (Dat, Nov 17): the field fills the area right of a waterfall line: straight drops with notched
       ledges stepping out to the left (Nov 17: back to steps, straighter than the first version). Stage units; app/lanes-home.css positions it. White = field shown.
       The edge is roughened and feathered so it reads as natural, not cut. -->
  <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="7"/>
  </filter>
  <path d="M493,-60 L493,470 Q493,492 471,494 L352,500 Q330,502 330,524 L330,642 Q330,664 308,666 L172,672 Q150,673 150,695 L150,858 Q150,880 128,881 L-40,886 Q-62,887 -62,909 L-62,1210 L2550,1210 L2550,-60 Z" fill="#fff" filter="url(#edge)"/>
</svg>
