<svg xmlns="http://www.w3.org/2000/svg" viewBox="-700 -50 3200 1250" width="3200" height="1250" preserveAspectRatio="none">
  <!-- Hero glyph field shape (Dat, Nov 17): the field fills the area right of one smooth curve, like a waterfall that
       drops past the copy and sweeps out to the bottom left (Nov 17: one curve instead of steps). Stage units; app/lanes-home.css positions it. White = field shown.
       The edge is roughened and feathered so it reads as natural, not cut. -->
  <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="9"/>
  </filter>
  <path d="M500,-60 L500,40 C500,430 470,560 330,660 C150,770 -120,930 -220,1210 L2550,1210 L2550,-60 Z" fill="#fff" filter="url(#edge)"/>
</svg>
