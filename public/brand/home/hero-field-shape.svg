<svg xmlns="http://www.w3.org/2000/svg" viewBox="-700 -50 3200 1250" width="3200" height="1250" preserveAspectRatio="none">
  <!-- Hero glyph field edge (Dat, Nov 17-18), stage units. A crisp vertical cut at x 500 (through the CE of "PRACTICE")
       from the top down to the figure's leftmost point (y about 628). Below that the field steps out into the
       bottom-left corner, one glyph row at a time, about 2.6 glyph columns further left per row, for three rows; from
       y 724 the corner is open and the image's own thinning takes over. The steps sit in the gaps between glyph
       rows and columns (the page snaps x 500 to a column gap), so no glyph is cut. See scripts/hero-glyph-field.py,
       CORNER_RAMP. Opaque = field shown. -->
  <rect x="500" y="-50" width="2000" height="1250" fill="#fff"/>
  <rect x="403.4" y="627.9" width="156.6" height="32.4" fill="#fff"/>
  <rect x="339.0" y="660.1" width="221.0" height="32.4" fill="#fff"/>
  <rect x="242.4" y="692.3" width="317.6" height="32.4" fill="#fff"/>
  <rect x="-700" y="724.5" width="1260" height="475.5" fill="#fff"/>
</svg>
